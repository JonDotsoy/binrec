<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">
<title>binrec: record everything a command reads and writes</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#161b22"/>
<stop offset="1" stop-color="#0d1117"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#ff3b30" stop-opacity="0.35"/>
<stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
</radialGradient>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
<feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
</filter>
</defs>
<style>
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.25}}
.rec{animation:blink 1.4s steps(1,end) infinite}
@keyframes caret{0%,50%{opacity:1}51%,100%{opacity:0}}
.caret{animation:caret 1s steps(1,end) infinite}
</style>
<rect width="1280" height="440" rx="16" fill="url(#bg)"/>

<!-- left: name and tagline -->
<g transform="translate(80 0)">
<circle class="rec" cx="34" cy="168" r="70" fill="url(#glow)"/>
<circle class="rec" cx="34" cy="168" r="24" fill="#ff3b30"/>
<text x="80" y="192" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">binrec</text>
<text x="2" y="250" font-size="22" fill="#8b949e">Record everything a command</text>
<text x="2" y="282" font-size="22" fill="#8b949e">reads and writes.</text>
<g font-size="15" transform="translate(2 318)">
<rect width="74" height="30" rx="15" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-opacity="0.5"/>
<text x="37" y="20" text-anchor="middle" fill="#79c0ff">stdin</text>
<rect x="84" width="84" height="30" rx="15" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-opacity="0.5"/>
<text x="126" y="20" text-anchor="middle" fill="#7ee787">stdout</text>
<rect x="178" width="84" height="30" rx="15" fill="#da3633" fill-opacity="0.18" stroke="#f85149" stroke-opacity="0.5"/>
<text x="220" y="20" text-anchor="middle" fill="#ff7b72">stderr</text>
<rect x="272" width="64" height="30" rx="15" fill="#8b949e" fill-opacity="0.15" stroke="#8b949e" stroke-opacity="0.5"/>
<text x="304" y="20" text-anchor="middle" fill="#c9d1d9">exit</text>
</g>
</g>

<!-- right: terminal being recorded -->
<g transform="translate(600 60)" filter="url(#shadow)">
<rect width="600" height="320" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M0 12a12 12 0 0 1 12-12h576a12 12 0 0 1 12 12v26H0z" fill="#161b22"/>
<line x1="0" y1="38" x2="600" y2="38" stroke="#30363d"/>
<circle cx="22" cy="19" r="6" fill="#ff5f57"/><circle cx="42" cy="19" r="6" fill="#febc2e"/><circle cx="62" cy="19" r="6" fill="#28c840"/>
<text x="300" y="24" font-size="13" fill="#8b949e" text-anchor="middle">~/project</text>
<g transform="translate(488 8)">
<rect width="98" height="22" rx="11" fill="#ff3b30" fill-opacity="0.15" stroke="#ff3b30" stroke-opacity="0.7"/>
<circle class="rec" cx="15" cy="11" r="5" fill="#ff3b30"/>
<text x="27" y="15.5" font-size="12" font-weight="700" fill="#ff6b62" letter-spacing="1">REC</text>
<text x="62" y="15.5" font-size="11" fill="#ff9b94">2.0s</text>
</g>
<g font-size="15" xml:space="preserve">
<text x="22" y="72" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> make build</text>
<text x="22" y="98" fill="#e6edf3">building...</text>
<text x="22" y="124" fill="#ff7b72">warning: unused variable</text>
<text x="22" y="150" fill="#e6edf3">done in 2.0s</text>
<text x="22" y="176" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> <tspan class="caret" fill="#e6edf3">▋</tspan></text>
</g>
<line x1="22" y1="198" x2="578" y2="198" stroke="#30363d" stroke-dasharray="4 5"/>
<g font-size="12.5" xml:space="preserve">
<text x="22" y="222" fill="#8b949e">→ ~/.binrec/records/e531b87f.ndjson</text>
<text x="22" y="246" fill="#6e7681">{"type":<tspan fill="#a5d6ff">"command"</tspan>,"command":"/usr/bin/make","args":["build"]}</text>
<text x="22" y="266" fill="#6e7681">{"type":<tspan fill="#7ee787">"stdout"</tspan>,"data":"building...\n"}</text>
<text x="22" y="286" fill="#6e7681">{"type":<tspan fill="#ff7b72">"stderr"</tspan>,"data":"warning: unused variable\n"}</text>
<text x="22" y="306" fill="#6e7681">{"type":<tspan fill="#d2a8ff">"end"</tspan>,"exitCode":0,"total":50}</text>
</g>
</g>
</svg>
