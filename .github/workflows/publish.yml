name: publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  # npm trusted publishing (OIDC), no npm token needed.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      # test/ui-browser.test.ts drives the play --ui page in headless Chromium.
      - run: bunx playwright-core install --with-deps --only-shell chromium

      - name: Bump version
        id: version
        run: |
          bun pm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - run: bun test --ci

      - run: bun run build

      - name: Pack dist
        id: pack
        run: echo "tarball=$RUNNER_TEMP/$(npm pack dist/ --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"

      - name: Publish dist to npm
        run: npm publish dist/

      - name: Commit and tag the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          SHA256=$(sha256sum dist/binrec.js | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          npm: https://www.npmjs.com/package/@jondotsoy/binrec/v/${VERSION}

          ### Homebrew

          \`\`\`ruby
          class Binrec < Formula
            desc "Record everything a command reads and writes"
            homepage "https://github.com/JonDotsoy/binrec"
            url "https://github.com/JonDotsoy/binrec/releases/download/v${VERSION}/binrec.js"
            version "${VERSION}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "oven-sh/bun/bun"

            def install
              bin.install "binrec.js" => "binrec"
            end

            # binrec 0.0.3 and older wrote records other users could read.
            def post_install
              records = Pathname.new(Dir.home)/".binrec/records"
              return unless records.directory?

              records.chmod 0700
              records.glob("*.{ndjson,json}").each { |file| file.chmod 0600 }
            rescue Errno::EPERM, Errno::EACCES
              opoo "Could not make #{records} private, run: chmod 700 #{records} && chmod 600 #{records}/*"
            end

            def caveats
              <<~EOS
                Records written by binrec 0.0.3 or older may be readable by other users.
                If you use another BINREC_HOME, make its records private with:
                  chmod 700 "\$BINREC_HOME/records" && chmod 600 "\$BINREC_HOME/records/"*
              EOS
            end

            test do
              system bin/"binrec"
            end
          end
          \`\`\`
          EOF
          gh release create "v${VERSION}" "$TARBALL" dist/binrec.js \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
