name: publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  # npm trusted publishing (OIDC), no npm token needed.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1

      - run: bun install --frozen-lockfile

      - name: Bump version
        id: version
        run: |
          bun pm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(bun -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - run: bun test --ci

      - run: bun run build

      - name: Pack dist
        id: pack
        run: echo "tarball=$RUNNER_TEMP/$(npm pack dist/ --silent --pack-destination "$RUNNER_TEMP")" >> "$GITHUB_OUTPUT"

      - name: Publish dist to npm
        run: npm publish dist/

      - name: Commit and tag the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ steps.pack.outputs.tarball }}" dist/binrec.js \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "npm: https://www.npmjs.com/package/@jondotsoy/binrec/v/${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
