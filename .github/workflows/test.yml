name: test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # test/ui-browser.test.ts drives the play --ui page in headless Chromium.
      - run: bunx playwright-core install --with-deps --only-shell chromium

      # test/export.test.ts encodes and reads back videos with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: bun test --ci
